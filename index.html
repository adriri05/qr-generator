<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador de QR</title>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Generador de QR</h1>
      <button type="button" id="theme" class="secondary theme-btn" title="Cambiar tema" aria-label="Cambiar tema"></button>
    </header>

    <div class="layout">
      <form class="controls" onsubmit="return false">
        <label class="field">
          <span>Tipo de contenido</span>
          <select id="preset">
            <option value="text">Texto / URL</option>
            <option value="wifi">WiFi</option>
            <option value="vcard">vCard (contacto)</option>
            <option value="email">Email</option>
            <option value="tel">Teléfono</option>
            <option value="sms">SMS</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="geo">Ubicación (geo)</option>
            <option value="event">Evento de calendario</option>
          </select>
        </label>

        <div class="panel" data-preset="text">
          <label class="field">
            <span>Texto o URL</span>
            <textarea id="text" rows="3" placeholder="https://example.com"></textarea>
          </label>
        </div>

        <div class="panel" data-preset="wifi" hidden>
          <label class="field"><span>Nombre de red (SSID)</span><input type="text" id="wifi-ssid" autocomplete="off"></label>
          <label class="field"><span>Contraseña</span><input type="text" id="wifi-pass" autocomplete="off"></label>
          <div class="row">
            <label class="field grow"><span>Seguridad</span>
              <select id="wifi-enc">
                <option value="WPA">WPA/WPA2/WPA3</option>
                <option value="WEP">WEP</option>
                <option value="nopass">Sin contraseña</option>
              </select>
            </label>
            <label class="check"><input type="checkbox" id="wifi-hidden"> Red oculta</label>
          </div>
        </div>

        <div class="panel" data-preset="vcard" hidden>
          <label class="field"><span>Nombre completo</span><input type="text" id="vc-name"></label>
          <label class="field"><span>Empresa</span><input type="text" id="vc-org"></label>
          <label class="field"><span>Teléfono</span><input type="tel" id="vc-phone"></label>
          <label class="field"><span>Email</span><input type="email" id="vc-email"></label>
          <label class="field"><span>Web</span><input type="url" id="vc-url"></label>
        </div>

        <div class="panel" data-preset="email" hidden>
          <label class="field"><span>Para</span><input type="email" id="mail-to"></label>
          <label class="field"><span>Asunto</span><input type="text" id="mail-subject"></label>
          <label class="field"><span>Mensaje</span><textarea id="mail-body" rows="3"></textarea></label>
        </div>

        <div class="panel" data-preset="tel" hidden>
          <label class="field"><span>Número</span><input type="tel" id="tel-number" placeholder="+34 600 000 000"></label>
        </div>

        <div class="panel" data-preset="sms" hidden>
          <label class="field"><span>Número</span><input type="tel" id="sms-number" placeholder="+34 600 000 000"></label>
          <label class="field"><span>Mensaje</span><textarea id="sms-body" rows="3"></textarea></label>
        </div>

        <div class="panel" data-preset="whatsapp" hidden>
          <label class="field"><span>Número (con prefijo internacional)</span><input type="tel" id="wa-number" placeholder="+34 600 000 000"></label>
          <label class="field"><span>Mensaje (opcional)</span><textarea id="wa-text" rows="3"></textarea></label>
        </div>

        <div class="panel" data-preset="geo" hidden>
          <div class="row">
            <label class="field grow"><span>Latitud</span><input type="text" id="geo-lat" inputmode="decimal" placeholder="40.4168"></label>
            <label class="field grow"><span>Longitud</span><input type="text" id="geo-lon" inputmode="decimal" placeholder="-3.7038"></label>
          </div>
        </div>

        <div class="panel" data-preset="event" hidden>
          <label class="field"><span>Título</span><input type="text" id="ev-title"></label>
          <div class="row">
            <label class="field grow"><span>Inicio</span><input type="datetime-local" id="ev-start"></label>
            <label class="field grow"><span>Fin</span><input type="datetime-local" id="ev-end"></label>
          </div>
          <label class="field"><span>Lugar</span><input type="text" id="ev-loc"></label>
        </div>

        <div class="field">
          <span>Logo central</span>
          <div class="row">
            <input type="file" id="logo" accept="image/*" hidden>
            <label for="logo" class="btn btn-secondary">Elegir imagen</label>
            <span id="logo-name" class="file-name">Sin logo</span>
            <button type="button" id="remove-logo" disabled>Quitar</button>
          </div>
        </div>

        <label class="field">
          <span>Tamaño del logo: <output id="logo-size-out">30%</output></span>
          <input type="range" id="logo-size" min="10" max="40" value="30">
        </label>

        <fieldset class="field shapes">
          <legend>Forma de los puntos</legend>
          <div class="shape-grid">
            <label class="shape" title="Cuadrado">
              <input type="radio" name="dot-type" value="square" checked>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="9" height="9"/><rect x="13" y="2" width="9" height="9"/><rect x="2" y="13" width="9" height="9"/><rect x="13" y="13" width="9" height="9"/></svg>
              <span>Cuadrado</span>
            </label>
            <label class="shape" title="Puntos">
              <input type="radio" name="dot-type" value="dots">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4"/><circle cx="17.5" cy="6.5" r="4"/><circle cx="6.5" cy="17.5" r="4"/><circle cx="17.5" cy="17.5" r="4"/></svg>
              <span>Puntos</span>
            </label>
            <label class="shape" title="Redondeado">
              <input type="radio" name="dot-type" value="rounded">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="2"/><rect x="13" y="2" width="9" height="9" rx="2"/><rect x="2" y="13" width="9" height="9" rx="2"/><rect x="13" y="13" width="9" height="9" rx="2"/></svg>
              <span>Redondeado</span>
            </label>
            <label class="shape" title="Muy redondeado">
              <input type="radio" name="dot-type" value="extra-rounded">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="4"/><rect x="13" y="2" width="9" height="9" rx="4"/><rect x="2" y="13" width="9" height="9" rx="4"/><rect x="13" y="13" width="9" height="9" rx="4"/></svg>
              <span>Muy redond.</span>
            </label>
            <label class="shape" title="Classy">
              <input type="radio" name="dot-type" value="classy">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6a4 4 0 0 1 4-4h5v5a4 4 0 0 1-4 4H2z M13 6a4 4 0 0 1 4-4h5v5a4 4 0 0 1-4 4h-5z M2 17a4 4 0 0 1 4-4h5v5a4 4 0 0 1-4 4H2z M13 17a4 4 0 0 1 4-4h5v5a4 4 0 0 1-4 4h-5z"/></svg>
              <span>Classy</span>
            </label>
            <label class="shape" title="Classy redondeado">
              <input type="radio" name="dot-type" value="classy-rounded">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h4v9H2V7a5 5 0 0 1 5-5z M13 2h5a4 4 0 0 1 4 4v5h-9z M2 13h9v9H6a4 4 0 0 1-4-4z M13 13h9v5a4 4 0 0 1-4 4h-5z"/></svg>
              <span>Classy red.</span>
            </label>
          </div>
        </fieldset>

        <div class="row colors">
          <label class="field">
            <span>Color QR</span>
            <input type="color" id="fg" value="#000000">
          </label>
          <label class="field">
            <span>Fondo</span>
            <input type="color" id="bg" value="#ffffff">
          </label>
        </div>

        <div class="field">
          <label class="check"><input type="checkbox" id="gradient"> Degradado</label>
          <div class="row" id="gradient-opts" hidden>
            <label class="field grow"><span>Color final</span><input type="color" id="fg2" value="#2563eb"></label>
            <label class="field grow"><span>Tipo</span>
              <select id="grad-type">
                <option value="linear">Lineal</option>
                <option value="radial">Radial</option>
              </select>
            </label>
          </div>
        </div>

        <fieldset class="field group">
          <legend>Esquinas</legend>
          <div class="row">
            <label class="field grow"><span>Marco</span>
              <select id="corner-sq">
                <option value="">Como los puntos</option>
                <option value="square">Cuadrado</option>
                <option value="dot">Circular</option>
                <option value="extra-rounded">Redondeado</option>
              </select>
            </label>
            <label class="field grow"><span>Centro</span>
              <select id="corner-dot">
                <option value="">Como los puntos</option>
                <option value="square">Cuadrado</option>
                <option value="dot">Circular</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label class="check"><input type="checkbox" id="corner-color-on"> Color propio</label>
            <input type="color" id="corner-color" value="#000000" class="inline-color" disabled>
          </div>
        </fieldset>

        <p id="contrast-warning" class="warning" hidden>
          Contraste bajo: el fondo debe ser más claro que el QR o puede no escanear.
        </p>

        <label class="field">
          <span>Tamaño de exportación: <output id="export-size-out">1000</output> px</span>
          <input type="range" id="export-size" min="300" max="2000" step="100" value="1000">
        </label>

        <div class="row">
          <label class="field grow">
            <span>Formato</span>
            <select id="format">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WEBP</option>
              <option value="svg">SVG</option>
            </select>
          </label>
        </div>

        <div class="row">
          <button type="button" id="download" disabled>Descargar</button>
          <button type="button" id="copy" class="secondary" disabled>Copiar imagen</button>
          <button type="button" id="reset" class="secondary">Restablecer</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>

      <section class="preview" aria-live="polite">
        <div id="qr"></div>
        <p id="placeholder" class="placeholder">Escribe un texto para generar el QR</p>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
